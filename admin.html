<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Administration — ZarGold</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#07090D">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%23E9B949'/><text x='50' y='70' font-size='54' text-anchor='middle' font-family='Segoe UI' font-weight='700' fill='%231A1200'>ZG</text></svg>">
<link rel="stylesheet" href="assets/css/app.css?v=8">
</head>
<body>

<div id="hdr"></div>

<!-- ============ ADMIN LOGIN ============ -->
<section class="auth" id="adminLogin" hidden style="grid-template-columns:1fr">
  <div class="auth__main">
    <div class="auth-card">
      <div class="eyebrow" id="lgEyebrow">Restricted</div>
      <h1 id="lgTitle">Administrator sign in</h1>
      <p id="lgSub">Restricted area — staff only.</p>
      <div id="lgAlert"></div>
      <form id="lgForm">
        <div class="field"><label for="lgEmail">Email</label>
          <input class="input" id="lgEmail" type="email" placeholder="admin@zargold.af" required></div>
        <div class="field"><label for="lgPass">Password</label>
          <input class="input" id="lgPass" type="password" placeholder="••••••••" required></div>
        <button class="btn btn--gold btn--block" type="submit" id="lgBtn">Sign in</button>
      </form>
      <div id="lgHint"></div>
    </div>
  </div>
</section>

<!-- ============ ADMIN SHELL ============ -->
<section class="shell" id="adminView" hidden>
  <aside class="side">
    <div class="side__label">Administration</div>
    <a href="#" data-view="overview" class="is-active" id="navOverview">Overview</a>
    <a href="#" data-view="accounts" id="navAccounts">Accounts <span id="pendingBadge"></span></a>
    <a href="#" data-view="transactions" id="navTx">Transactions</a>
    <div style="flex:1"></div>
    <a href="index.html">View website</a>
    <a href="#" id="adminLogout">Sign out</a>
  </aside>

  <main class="main">
    <div class="page-head">
      <div>
        <h1 id="pgTitle">Overview</h1>
        <p id="pgSub">Manage customer accounts and the transaction ledger.</p>
      </div>
      <div class="row" id="pgActions"></div>
    </div>

    <div class="kpis" id="kpis"></div>

    <div id="viewHost"></div>
  </main>
</section>

<!-- ============ MODAL ============ -->
<div class="modal-root" id="modalRoot">
  <div class="modal" id="modalBox"></div>
</div>

<div id="ftr"></div>

<script src="assets/js/config.js?v=8"></script>
<script src="assets/js/i18n.js?v=8"></script>
<script src="assets/js/prices.js?v=8"></script>
<script src="assets/js/store.js?v=8"></script>
<script src="assets/js/ui.js?v=8"></script>
<script src="assets/js/admin.js?v=8"></script>
</body>
</html>
